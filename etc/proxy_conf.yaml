BASE: "https://10.10.0.26"
NAME: "IHEP-SATOSA"
STATE_ENCRYPTION_KEY: "IHEP_SECRET_123"
USER_ID_HASH_SALT: "IHEP_SALT_123"

INTERNAL_ATTRIBUTES: "/opt/satosa/etc/internal_attributes.yaml"
COOKIE_STATE_NAME: "satosa_state"
COOKIE_SECURE: true
COOKIE_HTTPONLY: true
COOKIE_SAMESITE: None

BEHIND_REVERSE_PROXY: true

PLUGIN_PATHS:
  - "/opt/satosa/plugins/frontends"
  - "/opt/satosa/plugins/backends"

FRONTEND_MODULES:
  - "/opt/satosa/plugins/frontends/saml2_frontend.yaml"

BACKEND_MODULES:
  - "/opt/satosa/plugins/backends/saml2_backend.yaml"

LOGGING:
  version: 1
  disable_existing_loggers: false
  formatters:
    default:
      format: "%(asctime)s %(name)s %(levelname)s %(message)s"
  handlers:
    console:
      class: logging.StreamHandler
      formatter: default
      level: DEBUG
  root:
    level: DEBUG
    handlers: [console]
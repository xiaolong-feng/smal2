module: satosa.frontends.openid_connect.OpenIDConnectFrontend
name: OIDCFrontend
config:
  signing_key_path: "/opt/satosa/pki/satosa.key"
  signing_key_id: "satosa-oidc-test-key"
  client_db_path: "/opt/satosa/etc/oidc_clients.json"
  sub_hash_salt: "IHEP_OIDC_SUB_SALT_123"

  provider:
    client_registration_supported: false
    response_types_supported:
      - code
    subject_types_supported:
      - pairwise
      - public
    scopes_supported:
      - openid
      - profile
      - email
    id_token_lifetime: 3600

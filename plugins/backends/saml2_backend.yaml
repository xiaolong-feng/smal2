module: satosa.backends.saml2.SAMLBackend
name: Saml2Backend
config:
  disco_srv: "https://ds.carsi.edu.cn/login/index.html"
  memorize_idp: true

  sp_config:
    entityid: "https://10.10.0.26:8443/sp"
    name: "SATOSA SP"

    key_file: "/opt/satosa/pki/satosa.key"
    cert_file: "/opt/satosa/pki/satosa.crt"
    xmlsec_binary: /usr/bin/xmlsec1
    accepted_time_diff: 60

    metadata:
      local:
        - "/opt/satosa/metadata/idp/carsifed-metadata.xml"

    service:
      sp:
        allow_unsolicited: true
        authn_requests_signed: false
        want_response_signed: false
        want_assertions_signed: false

        endpoints:
          assertion_consumer_service:
            - - "https://10.10.0.26:8443/Saml2Backend/saml2/acs"
              - "urn:oasis:names:tc:SAML:2.0:bindings:HTTP-POST"
          discovery_response:
            - - "https://10.10.0.26/Saml2Backend/disco"
              - "urn:oasis:names:tc:SAML:profiles:SSO:idp-discovery-protocol"

        name_id_policy_format: "urn:oasis:names:tc:SAML:2.0:nameid-format:persistent"
        
        requested_attributes:
          - name: urn:oid:0.9.2342.19200300.100.1.1
            friendly_name: uid
            required: false
          - name: urn:oid:1.3.6.1.4.1.5923.1.1.1.6
            friendly_name: eduPersonPrincipalName
            required: false
          - name: urn:oid:0.9.2342.19200300.100.1.3
            friendly_name: mail
            required: false
          - name: urn:oid:2.16.840.1.113730.3.1.241
            friendly_name: displayName
            required: false
          - name: urn:oid:1.3.6.1.4.1.5923.1.1.1.10
            friendly_name: eduPersonTargetedID
            required: false
          - name: urn:oasis:names:tc:SAML:attribute:pairwise-id
            friendly_name: pairwise-id
            required: false
